[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gjbz299d-calc"
dynamic = ["version"]
description = "GJB/Z 299D—2024 电子设备可靠性预计计算器"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DuoYuWang", email = "thirteenking.wang@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.6,<7",
    "defusedxml>=0.7.1,<1",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "xlwt>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.14", "pyinstaller>=6.16,<7"]
build = ["pyinstaller>=6.16,<7"]

[project.urls]
Repository = "https://github.com/13022591351/GJBZ299D-Calc"

[project.scripts]
gjbz299d-calc = "src.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["assets/*.svg", "assets/*.png", "assets/*.ico"]

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
